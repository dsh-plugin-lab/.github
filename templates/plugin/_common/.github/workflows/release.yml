# Release. The chain itself — guards, build, publish, tag, Release, draft retirement — is shared, in
# dsh-plugin-lab/.github/.github/workflows/release-publish.yml. What stays here is what is this
# repository's own: the triggers, the environment name, and the permissions the called job inherits.
#
# A repository that needs a step inserted **between** build and publish keeps its own copy instead of
# calling this file; the environment name is the only thing the npm side ever sees.
#
# Changing this file means dispatching it once for real: pull-request CI runs ci.yml only, so a green
# check says nothing about whether the release path works.
name: Release

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Bypass the "no behaviour change, no release" guard'
        type: boolean
        default: false
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write # the called job pushes the tag, the commit and the Release
  id-token: write # npm Trusted Publishing

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Pinned to `main` until a tag of the shared flow exists; the pilot release is what justifies
    # pinning it.
    uses: dsh-plugin-lab/.github/.github/workflows/release-publish.yml@main
    with:
      # Must equal the environment named on this package's Trusted Publisher, word for word.
      environment: {{environment}}
      force: ${{ inputs.force || false }}
