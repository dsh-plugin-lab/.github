# Local commit hook: second-scale checks only, autofixing what it can and blocking only what it cannot.
#
# Trade-offs:
#   - Formatting and lint only (second-scale). typecheck / tests / check:release belong to ci.yml —
#     a slow hook gets skipped with --no-verify, which amounts to having no hook at all.
#   - Always `npx --no-install`: it uses only the versions already installed in the repository's
#     node_modules, **downloads nothing**, and therefore always matches what CI installed (npm ci).
#   - Autofixes (--write / --fix) change files in the working tree, so **they need re-adding**.
#
# Enable once per clone (install pre-commit itself with `uv tool install pre-commit`):
#   pre-commit install
# Run over everything:
#   pre-commit run --all-files
# Skip once:
#   git commit --no-verify
#
# Boundary: this file does not touch core.hooksPath and does not overwrite an existing placeholder
# hook under .git/hooks; pre-commit only writes .git/hooks/pre-commit.
repos:
  - repo: local
    hooks:
      - id: prettier
        name: prettier --write (npx --no-install)
        entry: npx --no-install prettier --write
        language: system
        files: \.(ts|tsx|js|jsx|mjs|cjs|json|css|scss|html|yml|yaml)$
        exclude: ^(node_modules/|lib/|package-lock\.json$)
        require_serial: true

      - id: eslint
        name: eslint --fix (npx --no-install)
        entry: npx --no-install eslint --fix
        language: system
        files: \.(ts|tsx|js|jsx|mjs|cjs)$
        exclude: ^(node_modules/|lib/)
        require_serial: true
